[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.6",
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.10",
    "peft>=0.15",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "seaborn>=0.13",
    "sentencepiece>=0.2",
    "statsmodels>=0.14",
    "torch==2.7.1",
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
